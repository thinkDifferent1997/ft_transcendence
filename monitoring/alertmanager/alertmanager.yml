route:
  receiver: discord
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 2h
 
receivers:
  - name: discord
    discord_configs:
      # url lives in a gitignored file, alertmanager does not expand env vars
      - webhook_url_file: /etc/alertmanager/discord_webhook_url
        title: '{{ if eq .Status "firing" }}🚨🚨🚨 {{ .CommonAnnotations.summary | toUpper }} 🚨🚨🚨{{ else }}✅ RESOLVED: {{ .CommonAnnotations.summary }}{{ end }}'
        message: |-
          {{ range .Alerts }}{{ .Annotations.description }}
          {{ end }}
          Dashboard: https://localhost:8443/grafana/d/ad2cg9f/monitoring-dashboard