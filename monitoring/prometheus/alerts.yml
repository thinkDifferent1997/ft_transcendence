groups:
  - name: quiz-arena
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 25s
        labels:
          severity: critical
        annotations:
          summary: backend unreachable
          description: prometheus could not scrape the backend for 25 seconds

      - alert: PostgresDown
        expr: pg_up == 0 or up{job="postgres"} == 0
        for: 25s
        labels:
          severity: critical
        annotations:
          summary: postgres unreachable
          description: database or its exporter is not responding

      - alert: HighErrorRate
        expr: sum(rate(http_request_duration_seconds_count{status_code=~"5.."}[5m])) > 0.5
        for: 25s
        labels:
          severity: warning
        annotations:
          summary: elevated 5xx rate
          description: more than 0.5 server errors per second over 25 seconds

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 25s
        labels:
          severity: warning
        annotations:
          summary: p95 latency above 1s
          description: 95% of requests take longer than 1 second