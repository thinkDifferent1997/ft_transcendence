name: transcendence

services:
  # ------------------------------------------------------------------------ #
  #                               PostgreSQL                                 #
  # ------------------------------------------------------------------------ #
  postgres:
    build:
      context: ./postgres
    container_name: postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ft_transcendence
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ft_transcendence"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - transcend_net
    restart: unless-stopped

  # ------------------------------------------------------------------------ #
  #                           Backend                                        #
  #  (Reached via nginx. Waits for postgres to be healthy before starting)   #
  # ------------------------------------------------------------------------ #
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ft_transcendence
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - transcend_net
    restart: unless-stopped

  # ------------------------------------------------------------------------ #
  # Frontend: multi-stage build (Vite build -> nginx serving dist/).         #
  # Internal only — fronted by the reverse proxy above.                      #
  # ------------------------------------------------------------------------ #
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    networks:
      - transcend_net
    restart: unless-stopped

  # ------------------------------------------------------------------------ #
  # Reverse proxy: HTTPS entry point, routes / to frontend, /api and         #
  # /ws to the backend. The only service exposed to the host (cf inception)  #
  # ------------------------------------------------------------------------ #
  nginx:
    build:
      context: ./nginx
    container_name: nginx
    #ports:
     #- "443:443"
    # Host port is configurable so rootless engines (podman at 42) can use a
    # non-privileged port (>=1024). Defaults to 443 for Docker. Set HTTPS_PORT
    # in .env (e.g. HTTPS_PORT=8443) on rootless setups.
    ports:
     - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - transcend_net
    restart: unless-stopped

# MONITORING SERVICES
# Prometheus 
  prometheus:
    image: docker.io/prom/prometheus:v3.13.2
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro,Z
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    depends_on:
      - backend
    networks:
      - transcend_net
    restart: unless-stopped
# Postgres exporter
  postgres-exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres_exporter
    env_file:
      - .env
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ft_transcendence?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcend_net
    restart: unless-stopped

  nginx-exporter:
    image: docker.io/nginx/nginx-prometheus-exporter:1.5.1
    container_name: nginx_exporter
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    depends_on:
      - nginx
    networks:
      - transcend_net
    restart: unless-stopped
# Graphana
  grafana:
    image: docker.io/grafana/grafana-oss:13.0.2
    container_name: grafana
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # served under /grafana/ behind nginx
      GF_SERVER_ROOT_URL: https://localhost:${HTTPS_PORT:-443}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
    depends_on:
      - prometheus
    networks:
      - transcend_net
    restart: unless-stopped
  alertmanager:
    image: docker.io/prom/alertmanager:v0.32.0
    container_name: alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,Z
      - ./monitoring/alertmanager/discord_webhook_url:/etc/alertmanager/discord_webhook_url:ro,Z
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    networks:
      - transcend_net
    restart: unless-stopped
# -------------------------------------------------------------------------- #
#                             Volume                                         #
#               (Permanent. Wiped only by 'make clean')                      #
# -------------------------------------------------------------------------- #
volumes:
  postgres_data:
    name: postgres_data
  prometheus_data:
    name: prometheus_data
  grafana_data:
    name: grafana_data

# -------------------------------------------------------------------------- #
#                             Network                                        #
#               (Only nginx is reachable from the host)                      #
# -------------------------------------------------------------------------- #
networks:
  transcend_net:
    name: transcend_net
    driver: bridge
