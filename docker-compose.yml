name: transcendence

services:
  # ------------------------------------------------------------------------ #
  #                               PostgreSQL                                 #
  # ------------------------------------------------------------------------ #
  postgres:
    build:
      context: ./postgres
    container_name: postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - transcend_net
    restart: unless-stopped

  # ------------------------------------------------------------------------ #
  #                           Backend                                        #
  #  (Reached via nginx. Waits for postgres to be healthy before starting)   #
  # ------------------------------------------------------------------------ #
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - transcend_net
    restart: unless-stopped

  # ------------------------------------------------------------------------ #
  # Frontend: multi-stage build (Vite build -> nginx serving dist/).         #
  # Internal only — fronted by the reverse proxy above.                      #
  # ------------------------------------------------------------------------ #
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    networks:
      - transcend_net
    restart: unless-stopped

  # ------------------------------------------------------------------------ #
  # Reverse proxy: HTTPS entry point, routes / to frontend, /api and         #
  # /ws to the backend. The only service exposed to the host (cf inception)  #
  # ------------------------------------------------------------------------ #
  nginx:
    build:
      context: ./nginx
    container_name: nginx
    #ports:
     #- "443:443"
    # Host port is configurable so rootless engines (podman at 42) can use a
    # non-privileged port (>=1024). Defaults to 443 for Docker. Set HTTPS_PORT
    # in .env (e.g. HTTPS_PORT=8443) on rootless setups.
    ports:
     - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - transcend_net
    restart: unless-stopped

# MONITORING SERVICES
# Prometheus 
  prometheus:
    image: docker.io/prom/prometheus:v3.13.2
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    depends_on:
      - backend
    networks:
      - transcend_net
    restart: unless-stopped
# Postgres exporter
  postgres-exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres_exporter
    env_file:
      - .env
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcend_net
    restart: unless-stopped

  nginx-exporter:
    image: docker.io/nginx/nginx-prometheus-exporter:1.5.1
    container_name: nginx_exporter
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    depends_on:
      - nginx
    networks:
      - transcend_net
    restart: unless-stopped

# -------------------------------------------------------------------------- #
#                             Volume                                         #
#               (Permanent. Wiped only by 'make clean')                      #
# -------------------------------------------------------------------------- #
volumes:
  postgres_data:
    name: postgres_data
  prometheus_data:
    name: prometheus_data

# -------------------------------------------------------------------------- #
#                             Network                                        #
#               (Only nginx is reachable from the host)                      #
# -------------------------------------------------------------------------- #
networks:
  transcend_net:
    name: transcend_net
    driver: bridge
